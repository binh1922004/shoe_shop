
services:
  mysql:
    image: mysql:8.0
    container_name: mysql-container-shoeshop
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shoeshop
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  shoeshop:
    build:
      context: .              # Đường dẫn tới thư mục chứa Dockerfile
      dockerfile: Dockerfile  # Tên file Dockerfile (nếu khác tên thì sửa)
    container_name: shoeshop-container
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shoeshop
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
volumes:
  mysql_data: